name: Tests

# Only when code changes. Data-only changes (data/, img/) are covered by "Validate data".
on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - '.claude/skills/**/scripts/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - '.claude/skills/**/scripts/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the scripts (includes the Python/JavaScript cross-check)
        run: python3 -m unittest discover -s tests/python -v
      - name: Test the page
        run: node --test tests/js/*.test.mjs
